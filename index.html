<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#eef2f1;
    --bg-elevated:#ffffff;
    --ink:#1f2a3c;
    --ink-soft:#5b6675;
    --line:#d7dedb;
    --line-soft:#e6ebe9;
    --accent-6:#3e7cb1;
    --accent-7:#4c9a6a;
    --accent-8:#b1793e;
    --accent-9:#8b5fbf;
    --accent-el:#2a8f86;
    --danger:#b1493e;
    --danger-bg:#f6e9e7;
    --done-bg:#eaf3ea;
    --shadow: 0 1px 2px rgba(31,42,60,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161b22;
      --bg-elevated:#1f2530;
      --ink:#e7ebee;
      --ink-soft:#9aa4b2;
      --line:#333c48;
      --line-soft:#2a3037;
      --done-bg:#1c2b20;
      --danger-bg:#2e1f1e;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161b22;
    --bg-elevated:#1f2530;
    --ink:#e7ebee;
    --ink-soft:#9aa4b2;
    --line:#333c48;
    --line-soft:#2a3037;
    --done-bg:#1c2b20;
    --danger-bg:#2e1f1e;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  .storage-note{
    font-size:0.78rem;
    color:var(--ink-soft);
    background:var(--bg-elevated);
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:20px;
  }
  .storage-note.local{color:var(--accent-8);border-color:var(--accent-8);}
  .today-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin:-18px 0 24px;flex-wrap:wrap;
  }
  .today-banner{font-size:0.85rem;color:var(--ink-soft);}
  .tomorrow-wrap{position:relative;flex-shrink:0;}
  .tomorrow-btn{
    background:none;border:1px solid var(--line);color:var(--ink-soft);
    padding:4px 10px;border-radius:20px;font-size:0.78rem;cursor:pointer;font-family:inherit;
  }
  .tomorrow-btn:hover{background:var(--line-soft);}
  .tomorrow-popup{
    position:absolute;top:calc(100% + 6px);right:0;min-width:220px;max-width:280px;
    background:var(--bg-elevated);border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow);padding:10px 12px;z-index:20;
  }
  .tomorrow-title{font-family:'Fraunces', serif;font-weight:600;font-size:0.95rem;margin-bottom:8px;}
  .tomorrow-row{
    display:flex;justify-content:space-between;gap:10px;font-size:0.82rem;
    padding:3px 0;border-bottom:1px solid var(--line-soft);
  }
  .tomorrow-row:last-child{border-bottom:none;}
  .tomorrow-period{color:var(--ink-soft);white-space:nowrap;}

  /* ---------- HOME ---------- */
  .grade-block{margin-bottom:30px;}
  .grade-block h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0 0 12px 2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .grade-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--dot,#999);
    display:inline-block;
  }
  .group-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  @media (max-width:520px){
    .group-row{grid-template-columns:1fr 1fr;}
  }
  .group-card{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-left:3px solid var(--dot,#999);
    border-radius:8px;
    padding:12px 14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    text-align:left;
    transition:transform .12s ease, border-color .12s ease;
  }
  .group-card:hover{transform:translateY(-1px);}
  .group-card:focus-visible{outline:2px solid var(--dot,#999);outline-offset:2px;}
  .group-card.today-class{box-shadow:0 0 0 2px var(--dot,#999), var(--shadow);}
  .today-badge{
    display:inline-block;font-size:0.62rem;font-weight:600;letter-spacing:0.02em;
    text-transform:uppercase;color:#fff;background:var(--dot,#999);
    padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle;
  }
  .group-card .g-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.1rem;
  }
  .group-card .g-frac{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .group-card .g-bar{
    height:5px;border-radius:3px;background:var(--line-soft);
    margin:8px 0 6px;overflow:hidden;
  }
  .group-card .g-bar-fill{
    height:100%;background:var(--dot,#999);border-radius:3px;
  }
  .group-card .g-next{
    font-size:0.78rem;
    color:var(--ink-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .group-card .g-empty{
    font-size:0.78rem;color:var(--ink-soft);font-style:italic;
  }
  .g-room{
    font-size:0.7rem;color:var(--ink-soft);
    background:var(--line-soft);border-radius:10px;
    padding:1px 7px;display:inline-block;margin-left:6px;vertical-align:middle;
  }
  .detail-room{font-size:0.9rem;color:var(--ink-soft);font-weight:500;}

  /* ---------- DETAIL ---------- */
  .detail-header{
    display:flex;align-items:center;gap:14px;margin-bottom:20px;
  }
  .back-btn{
    background:none;border:1px solid var(--line);color:var(--ink);
    padding:6px 12px;border-radius:20px;font-size:0.85rem;cursor:pointer;
    font-family:inherit;
  }
  .back-btn:hover{background:var(--line-soft);}
  .detail-header h2{
    font-family:'Fraunces', serif;font-weight:700;font-size:1.6rem;margin:0;
  }
  .lesson-list{list-style:none;margin:0 0 16px;padding:0;counter-reset:lesson;}
  .lesson-row{
    counter-increment:lesson;
    display:flex;gap:12px;align-items:flex-start;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .lesson-row.done{background:var(--done-bg);}
  .lesson-row::before{
    content:counter(lesson);
    font-family:'Fraunces', serif;font-weight:600;
    color:var(--ink-soft);
    min-width:20px;padding-top:3px;font-size:0.95rem;
  }
  .check{display:flex;align-items:flex-start;padding-top:3px;cursor:pointer;}
  .check input{width:17px;height:17px;cursor:pointer;accent-color:var(--dot,#3e7cb1);}
  .reorder-btns{display:flex;flex-direction:column;gap:2px;padding-top:2px;flex-shrink:0;}
  .reorder-btns button{
    border:1px solid var(--line);background:var(--bg-elevated);color:var(--ink-soft);
    border-radius:4px;width:20px;height:18px;font-size:0.6rem;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .reorder-btns button:hover:not(:disabled){background:var(--line-soft);}
  .reorder-btns button:disabled{opacity:0.3;cursor:default;}
  .lesson-main{flex:1;min-width:0;}
  .lesson-line1{display:flex;align-items:center;gap:6px;}
  .lesson-title-input{
    flex:1;min-width:0;border:none;background:transparent;color:var(--ink);
    font-size:0.98rem;font-weight:500;padding:2px 0;font-family:inherit;
  }
  .lesson-row.done .lesson-title-input{color:var(--ink-soft);text-decoration:line-through;}
  .lesson-title-input:focus{outline:none;border-bottom:1px solid var(--line);}
  .icon-btn{
    border:1px solid var(--line);background:var(--bg-elevated);color:var(--ink-soft);
    border-radius:6px;padding:3px 7px;font-size:0.85rem;line-height:1.3;cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--line-soft);}
  .icon-btn.active{background:var(--dot,#3e7cb1);border-color:var(--dot,#3e7cb1);color:#fff;}
  .lesson-extra{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .link-row{display:flex;gap:8px;align-items:center;}
  .link-label{flex-shrink:0;font-size:0.9rem;opacity:0.8;}
  .link-row input{
    flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);font-size:0.82rem;font-family:inherit;
  }
  .link-row input:focus{outline:none;border-color:var(--dot,#3e7cb1);}
  .open-link{
    font-size:0.78rem;color:var(--ink);text-decoration:none;white-space:nowrap;
    border:1px solid var(--line);padding:5px 10px;border-radius:6px;flex-shrink:0;
  }
  .open-link:hover{background:var(--line-soft);}
  .link-chip{
    flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line-soft);border-radius:6px;
    background:var(--line-soft);color:var(--ink-soft);font-size:0.82rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .lesson-notes{
    width:100%;min-height:34px;resize:vertical;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);
    font-family:inherit;font-size:0.85rem;padding:6px 8px;border-radius:6px;
  }
  .lesson-notes:focus{outline:none;border-color:var(--dot,#3e7cb1);}
  .lesson-notes::placeholder{color:var(--ink-soft);opacity:0.7;}
  .classroom-send{
    display:flex;flex-direction:column;gap:8px;padding:10px;
    border:1px dashed var(--line);border-radius:8px;background:var(--bg);
  }
  .classroom-send input[type="file"]{font-size:0.8rem;color:var(--ink-soft);}
  .cr-copy-label{display:flex;align-items:center;gap:6px;font-size:0.82rem;color:var(--ink-soft);cursor:pointer;}
  .cr-send-btn{
    align-self:flex-start;padding:7px 14px;border-radius:6px;border:none;
    background:var(--accent-el);color:#fff;font-family:inherit;font-size:0.85rem;
    font-weight:500;cursor:pointer;
  }
  .cr-send-btn:disabled{opacity:0.5;cursor:default;}
  .cr-status{font-size:0.78rem;color:var(--ink-soft);min-height:1em;}
  .del-btn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-size:1.1rem;line-height:1;padding:2px 4px;border-radius:4px;
  }
  .del-btn:hover{color:var(--danger);background:var(--danger-bg);}
  .del-btn.confirm{color:#fff;background:var(--danger);font-size:0.72rem;padding:3px 8px;}

  .add-lesson-row{
    display:flex;gap:8px;margin-top:4px;
  }
  .add-lesson-row input{
    flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-elevated);color:var(--ink);font-family:inherit;font-size:0.9rem;
  }
  .add-lesson-row input:focus{outline:none;border-color:var(--dot,#3e7cb1);}
  .add-lesson-row button{
    padding:9px 16px;border-radius:8px;border:none;
    background:var(--dot,#3e7cb1);color:#fff;font-family:inherit;font-weight:500;
    cursor:pointer;font-size:0.9rem;
  }
  .add-lesson-row button:hover{opacity:0.9;}

  .empty-state{
    color:var(--ink-soft);font-size:0.88rem;font-style:italic;padding:6px 2px 16px;
  }
  .loading{color:var(--ink-soft);font-size:0.88rem;padding:20px 2px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>My Planning</h1>
    <span class="storage-note" id="storageNote">Syncing…</span>
  </header>
  <div class="today-row">
    <div class="today-banner hidden" id="todayBanner"></div>
    <div class="tomorrow-wrap">
      <button class="tomorrow-btn" onclick="app.toggleTomorrow()">📅 Tomorrow</button>
      <div class="tomorrow-popup hidden" id="tomorrowPopup"></div>
    </div>
  </div>

  <div id="homeView"></div>
  <div id="detailView" class="hidden"></div>
</div>

<script>
(function(){
  "use strict";

  // Your Firebase project config (Project settings → General → Your apps → SDK setup).
  // See README.md for the steps to create the project and fill in these values.
  const firebaseConfig = {
    apiKey: "AIzaSyCUg67VGoEJ8NcyJpdVVkH44__SzUkmsr0",
    authDomain: "my-planning-cbe30.firebaseapp.com",
    projectId: "my-planning-cbe30",
    storageBucket: "my-planning-cbe30.firebasestorage.app",
    messagingSenderId: "641857686466",
    appId: "1:641857686466:web:f05883c0c6df5d4569245b"
  };

  const GRADES = [
    {id:'6',  name:'Sixth',    color:'var(--accent-6)', groups:['A','B','C']},
    {id:'7',  name:'Seventh',  color:'var(--accent-7)', groups:['A','B','C']},
    {id:'8',  name:'Eighth',   color:'var(--accent-8)', groups:['A','B','C']},
    {id:'9',  name:'Ninth',    color:'var(--accent-9)', groups:['A','B','C']},
    {id:'EL', name:'Elective', color:'var(--accent-el)', groups:['']},
  ];
  // groupId ("6A", "EL", ...) -> gradeId, built once from GRADES above.
  const GROUP_TO_GRADE = {};
  GRADES.forEach(grade => grade.groups.forEach(suffix => { GROUP_TO_GRADE[grade.id+suffix] = grade.id; }));

  // Your Google Calendar API key, used to read which rotation day (1-6) the
  // school's academic calendar says today is (looks for a "Día N" event).
  // Leave apiKey as-is to skip this feature. See README.md for setup steps.
  const CALENDAR_CONFIG = {
    apiKey: 'AIzaSyAbD-IkrMKx5mWukb8nu17JQpJS-d9hjPQ',
    calendarId: 'comunicaciones@liceoingles.edu.co'
  };

  // Which groups you teach on each rotation day, and in which period, from
  // your bell schedule. Duty/location periods (Snack, Restaurant, Flex,
  // Coliseo...) aren't classes and are left out. Update this if your
  // schedule changes.
  const SCHEDULE_BY_DAY = {
    '1': { '6C':['Period 1'], '8C':['Period 3'], '7A':['Period 4'], '7B':['Period 5'], '8B':['Period 6'] },
    '2': { '7B':['Period 1'], '6A':['Period 2'], '8A':['Period 3'], '7A':['Period 4'], '8C':['Period 6'] },
    '3': { '6A':['Period 2'], '6B':['Period 4'], '7C':['Period 5'] },
    '4': { '9C':['Homeroom'], '8B':['Period 2'], '7C':['Period 3'], '6C':['Period 4'] },
    '5': { '9B':['Homeroom','Break'], '9A':['Period 2'], '9C':['Period 5'] },
    '6': { '9A':['Homeroom'], '8A':['Period 2'], '6B':['Period 5'], 'EL':['Period 6'] },
  };
  let todayDayNumber = null; // '1'-'6' once known, else null (no school today, or not fetched yet)
  let tomorrowDayNumber; // undefined = not fetched yet, null = no school, '1'-'6' once known

  // Bell schedules (24h "HH:MM", America/Bogota) used for the "current
  // period" indicator. Middle school (6-8, Elective) and high school (9)
  // run on different clocks. Grade 9 has no listed Lunch/Period 6 because
  // this schedule never has a grade-9 class in those slots.
  const MS_SCHEDULE = [
    {label:'Period 1', start:'07:45', end:'08:40'},
    {label:'Period 2', start:'08:45', end:'09:40'},
    {label:'Period 3', start:'09:45', end:'10:40'},
    {label:'Break',    start:'10:40', end:'11:05'},
    {label:'Period 4', start:'11:10', end:'12:05'},
    {label:'Period 5', start:'12:10', end:'13:05'},
    {label:'Lunch',    start:'13:05', end:'14:00'},
    {label:'Period 6', start:'14:05', end:'15:00'},
  ];
  const HS_SCHEDULE = [
    {label:'Homeroom', start:'07:30', end:'08:15'},
    {label:'Period 1', start:'08:20', end:'09:05'},
    {label:'Period 2', start:'09:10', end:'09:55'},
    {label:'Period 3', start:'09:55', end:'10:20'},
    {label:'Break',    start:'10:25', end:'11:10'},
    {label:'Period 4', start:'11:15', end:'12:00'},
    {label:'Period 5', start:'12:05', end:'12:50'},
  ];

  // Optional: each group's Google Classroom link, used by the "Copy for
  // Classroom" shortcut to jump straight to that group's course. Paste
  // either the full URL (classroom.google.com/c/COURSE_ID/...) or just the
  // COURSE_ID. Leave blank to just open the Classroom homepage instead.
  const CLASSROOM_LINKS = {
    '6A':'https://classroom.google.com/c/ODc1MjU2NDQwMzY5',
    '6B':'https://classroom.google.com/c/ODc1MjU2MTk2NzMx',
    '6C':'https://classroom.google.com/c/ODc1MjU2MDI5NDk3',
    '7A':'https://classroom.google.com/c/ODc1MjU1OTQ0NDkz',
    '7B':'https://classroom.google.com/c/ODc1MjU2MDIzODEx',
    '7C':'https://classroom.google.com/c/ODc1MjU1NzY1MDI4',
    '8A':'https://classroom.google.com/c/ODY5MTgyMzkzNzYz',
    '8B':'https://classroom.google.com/c/ODc1MjU3MzcxMzI4',
    '8C':'https://classroom.google.com/c/ODc1MjU3NjUzMTcz',
    '9A':'https://classroom.google.com/c/ODc1MjU4MDgyNTAy',
    '9B':'https://classroom.google.com/c/ODY5MTgyMzg1NjU2',
    '9C':'https://classroom.google.com/c/ODc1MjU3OTIzMDc5',
    'EL':''
  };

  // OAuth Client ID for real Classroom automation (create a draft with an
  // uploaded file attached). Different from the Calendar API key above —
  // this one asks you to sign in and grant permission. Leave as-is to
  // disable this feature. See README.md for setup steps.
  const OAUTH_CONFIG = {
    clientId: 'YOUR_OAUTH_CLIENT_ID.apps.googleusercontent.com',
    scopes: 'https://www.googleapis.com/auth/classroom.coursework.students https://www.googleapis.com/auth/drive.file'
  };
  let oauthTokenClient = null;
  let oauthAccessToken = null;
  function oauthConfigured(){
    return !!(OAUTH_CONFIG.clientId && OAUTH_CONFIG.clientId !== 'YOUR_OAUTH_CLIENT_ID.apps.googleusercontent.com');
  }
  function getAccessToken(){
    return new Promise((resolve, reject)=>{
      if(typeof google === 'undefined' || !google.accounts){
        reject(new Error('Google sign-in script not loaded yet — try again in a moment.'));
        return;
      }
      if(!oauthTokenClient){
        oauthTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: OAUTH_CONFIG.clientId,
          scope: OAUTH_CONFIG.scopes,
          callback: ()=>{} // overridden per-call below
        });
      }
      oauthTokenClient.callback = (resp)=>{
        if(resp.error){ reject(new Error(resp.error)); return; }
        oauthAccessToken = resp.access_token;
        resolve(oauthAccessToken);
      };
      oauthTokenClient.requestAccessToken({ prompt: oauthAccessToken ? '' : 'consent' });
    });
  }
  async function uploadFileToDrive(file, token){
    const boundary = 'planeacion-boundary-' + Date.now();
    const delimiter = `\r\n--${boundary}\r\n`;
    const closeDelim = `\r\n--${boundary}--`;
    const metadataPart = delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({name: file.name});
    const mediaHeader = delimiter + `Content-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`;
    const body = new Blob([metadataPart, mediaHeader, file, closeDelim]);
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': `multipart/related; boundary=${boundary}`
      },
      body
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error((err.error && err.error.message) || `Drive upload failed (${res.status})`);
    }
    const data = await res.json();
    return data.id;
  }
  async function createClassroomDraft(courseId, title, driveFileId, shareCopies, token){
    const body = {
      title,
      workType: 'ASSIGNMENT',
      state: 'DRAFT',
      materials: [{
        driveFile: {
          driveFile: { id: driveFileId },
          shareMode: shareCopies ? 'STUDENT_COPY' : 'VIEW'
        }
      }]
    };
    const res = await fetch(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWork`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error((err.error && err.error.message) || `Classroom API error (${res.status})`);
    }
    return res.json();
  }

  // Each group's classroom/room number, shown on its card. Edit if rooms
  // change for a new school year.
  const ROOM_NUMBERS = {
    '6A':'2', '6B':'3', '6C':'4',
    '7A':'Music Room', '7B':'6', '7C':'15',
    '8A':'14', '8B':'1', '8C':'5',
    '9A':'7', '9B':'8', '9C':'9',
    'EL':''
  };

  const state = { grades:{}, groups:{} };
  let currentGroup = null; // e.g. "6A"
  let db = null;
  let storageMode = 'pending'; // 'db' | 'local'
  let editingActive = false; // true while a title/notes field has focus

  // ephemeral UI-only state: which link/comment panels are expanded.
  // Not persisted — resets on reload. Defaults to "open" when the
  // lesson already has content, "closed" otherwise, until toggled.
  const panelState = {};
  function isPanelOpen(key, hasContent){
    return (key in panelState) ? panelState[key] : !!hasContent;
  }

  // ephemeral: which link fields are showing the raw-URL input vs the
  // compact "link saved" chip. Links with content default to chip
  // view (hides the long URL) until the user taps the edit icon.
  const linkEditState = {};
  function isLinkEditing(key, hasContent){
    return (key in linkEditState) ? linkEditState[key] : !hasContent;
  }

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  }

  // ---------- storage abstraction ----------
  const LS_PREFIX = 'planeacion_v1_';
  function lsGet(key){
    try{ const v = localStorage.getItem(LS_PREFIX+key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  function lsSet(key, val){
    try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }catch(e){}
  }

  function gradeKey(g){ return 'grade_'+g; }
  function groupKey(g){ return 'group_'+g; }

  function loadGradeLocal(g){
    state.grades[g] = lsGet(gradeKey(g)) || {lessons:[]};
  }
  function loadGroupLocal(g){
    state.groups[g] = lsGet(groupKey(g)) || {progress:{}};
  }

  async function saveGrade(gradeId, data){
    state.grades[gradeId] = data;
    if(storageMode === 'db'){
      try{ await db.doc('grades/'+gradeId).set(data); }catch(e){ console.error(e); }
    } else {
      lsSet(gradeKey(gradeId), data);
    }
  }
  async function saveGroup(groupId, data){
    state.groups[groupId] = data;
    if(storageMode === 'db'){
      try{ await db.doc('groups/'+groupId).set(data); }catch(e){ console.error(e); }
    } else {
      lsSet(groupKey(groupId), data);
    }
  }

  // ---------- data helpers ----------
  function gradeOf(groupId){ return GROUP_TO_GRADE[groupId]; }
  function gradeInfo(gradeId){ return GRADES.find(g=>g.id===gradeId); }
  function todayPeriodLabel(groupId){
    if(!todayDayNumber) return null;
    const day = SCHEDULE_BY_DAY[todayDayNumber];
    const periods = day && day[groupId];
    return periods ? periods.join(' · ') : null;
  }
  function isTodayClass(groupId){
    return todayPeriodLabel(groupId) !== null;
  }
  function classroomCourseIdFor(groupId){
    const raw = (CLASSROOM_LINKS[groupId] || '').trim();
    if(!raw) return '';
    const m = /\/c\/([a-zA-Z0-9_-]+)/.exec(raw);
    return m ? m[1] : raw;
  }

  function summarize(groupId){
    const g = gradeOf(groupId);
    const lessons = (state.grades[g] && state.grades[g].lessons) || [];
    const progress = (state.groups[groupId] && state.groups[groupId].progress) || {};
    const total = lessons.length;
    const done = lessons.filter(l => progress[l.id] && progress[l.id].done).length;
    const next = lessons.find(l => !(progress[l.id] && progress[l.id].done));
    return {total, done, nextTitle: next ? next.title : null};
  }

  // ---------- rendering: home ----------
  function renderHome(){
    const homeView = document.getElementById('homeView');
    let html = '';
    GRADES.forEach(grade=>{
      const loaded = !!state.grades[grade.id];
      const colStyle = grade.groups.length !== 3 ? ` style="grid-template-columns:repeat(${grade.groups.length}, 1fr)"` : '';
      const sectionLabel = grade.groups.length > 1 ? `${grade.name} Grade` : grade.name;
      html += `<section class="grade-block">
        <h2><span class="grade-dot" style="--dot:${grade.color}"></span>${sectionLabel}</h2>
        <div class="group-row"${colStyle}>`;
      grade.groups.forEach(suffix=>{
        const groupId = grade.id + suffix;
        const label = suffix ? groupId : grade.name;
        const periodLabel = todayPeriodLabel(groupId);
        const todayCls = periodLabel ? ' today-class' : '';
        const todayBadge = periodLabel ? ` <span class="today-badge">${escapeHtml(periodLabel)}</span>` : '';
        const room = ROOM_NUMBERS[groupId];
        const roomBadge = room ? ` <span class="g-room">🚪 ${escapeHtml(room)}</span>` : '';
        if(!loaded || !state.groups[groupId]){
          html += `<div class="group-card${todayCls}" style="--dot:${grade.color}"><div class="g-name">${label}${roomBadge}</div><div class="g-empty">Loading…</div></div>`;
          return;
        }
        const s = summarize(groupId);
        let bodyHtml;
        if(s.total === 0){
          bodyHtml = `<div class="g-empty">No lessons yet</div>`;
        } else {
          const pct = Math.round((s.done/s.total)*100);
          const nextLine = s.nextTitle ? escapeHtml(s.nextTitle) : 'Completed!';
          bodyHtml = `
            <div class="g-frac">${s.done}/${s.total} lessons</div>
            <div class="g-bar"><div class="g-bar-fill" style="width:${pct}%; --dot:${grade.color}"></div></div>
            <div class="g-next">${nextLine}</div>`;
        }
        html += `<button class="group-card${todayCls}" style="--dot:${grade.color}" onclick="app.openGroup('${groupId}')">
          <div class="g-name">${label}${todayBadge}${roomBadge}</div>
          ${bodyHtml}
        </button>`;
      });
      html += `</div></section>`;
    });
    homeView.innerHTML = html;
  }

  // ---------- rendering: detail ----------
  function renderDetail(){
    if(!currentGroup) return;
    const detailView = document.getElementById('detailView');
    const g = gradeOf(currentGroup);
    const grade = gradeInfo(g);
    const lessons = (state.grades[g] && state.grades[g].lessons) || [];
    const progress = (state.groups[currentGroup] && state.groups[currentGroup].progress) || {};

    let rows = '';
    if(lessons.length === 0){
      const gradeLabel = grade.groups.length > 1 ? `${grade.name} grade` : grade.name;
      const groupList = grade.groups.map(suf=>grade.id+suf).join('/');
      const sharedMsg = grade.groups.length > 1 ? ` It'll be shared with ${groupList}, each group tracks its own progress.` : '';
      rows = `<p class="empty-state">No lessons yet for ${gradeLabel}. Add the first one below.${sharedMsg}</p>`;
    } else {
      rows = '<ol class="lesson-list">' + lessons.map((lesson, idx)=>{
        const isFirst = idx === 0;
        const isLast = idx === lessons.length - 1;
        const p = progress[lesson.id] || {done:false, notes:''};
        const slidesKey = lesson.id+':slides';
        const worksheetKey = lesson.id+':worksheet';
        const notesKey = lesson.id+':notes';
        const sendKey = lesson.id+':classroomSend';
        const slidesLink = lesson.slidesLink || lesson.link || ''; // lesson.link = value from older versions
        const worksheetLink = lesson.worksheetLink || '';
        const hasSlides = !!slidesLink.trim();
        const hasWorksheet = !!worksheetLink.trim();
        const hasNotes = !!(p.notes && p.notes.trim());
        const slidesOpen = isPanelOpen(slidesKey, hasSlides);
        const worksheetOpen = isPanelOpen(worksheetKey, hasWorksheet);
        const notesOpen = isPanelOpen(notesKey, hasNotes);
        const sendOpen = isPanelOpen(sendKey, false);
        return `<li class="lesson-row ${p.done?'done':''}" data-lid="${lesson.id}">
          <label class="check">
            <input type="checkbox" ${p.done?'checked':''} onchange="app.toggleLesson('${lesson.id}', this.checked)">
          </label>
          <div class="reorder-btns">
            <button title="Move up" aria-label="Move up" ${isFirst?'disabled':''} onclick="app.moveLesson('${lesson.id}', -1)">▲</button>
            <button title="Move down" aria-label="Move down" ${isLast?'disabled':''} onclick="app.moveLesson('${lesson.id}', 1)">▼</button>
          </div>
          <div class="lesson-main">
            <div class="lesson-line1">
              <input class="lesson-title-input" value="${escapeAttr(lesson.title)}"
                onfocus="app.setEditing(true)"
                onblur="app.setEditing(false); app.renameLesson('${lesson.id}', this.value)">
              <button class="icon-btn ${hasSlides?'active':''}" title="Slides" aria-label="Slides" onclick="app.togglePanel('${slidesKey}', ${hasSlides})">📊</button>
              <button class="icon-btn ${hasWorksheet?'active':''}" title="Worksheet" aria-label="Worksheet" onclick="app.togglePanel('${worksheetKey}', ${hasWorksheet})">📝</button>
              <button class="icon-btn ${hasNotes?'active':''}" title="Comment" aria-label="Comment" onclick="app.togglePanel('${notesKey}', ${hasNotes})">💬</button>
              <button class="icon-btn" title="Open Classroom" aria-label="Open Classroom" onclick="app.openClassroom()">🏫</button>
              <button class="icon-btn ${sendOpen?'active':''}" title="Send file to Classroom" aria-label="Send file to Classroom" onclick="app.togglePanel('${sendKey}', false)">📤</button>
            </div>
            <div class="lesson-extra">
              ${sendOpen ? renderClassroomSend(lesson.id) : ''}
              ${slidesOpen ? renderLinkRow({
                key: slidesKey, icon:'📊', placeholder:'Slides link (Drive)...',
                value: slidesLink, hasContent: hasSlides,
                saveFn: 'saveSlidesLink', lessonId: lesson.id
              }) : ''}
              ${worksheetOpen ? renderLinkRow({
                key: worksheetKey, icon:'📝', placeholder:'Worksheet link (Drive)...',
                value: worksheetLink, hasContent: hasWorksheet,
                saveFn: 'saveWorksheetLink', lessonId: lesson.id
              }) : ''}
              ${notesOpen ? `<textarea class="lesson-notes" placeholder="Comment for this group (what was missed, homework assigned...)"
                onfocus="app.setEditing(true)"
                onblur="app.setEditing(false)"
                oninput="app.debouncedSaveNotes('${lesson.id}', this.value)">${escapeHtml(p.notes||'')}</textarea>` : ''}
            </div>
          </div>
          <button class="del-btn" onclick="app.deleteLesson(event, '${lesson.id}')">×</button>
        </li>`;
      }).join('') + '</ol>';
    }

    detailView.innerHTML = `
      <div class="detail-header">
        <button class="back-btn" onclick="app.goHome()">← ${grade.name}</button>
        <h2>${grade.groups.length > 1 ? currentGroup : grade.name}</h2>
        ${ROOM_NUMBERS[currentGroup] ? `<span class="detail-room">🚪 ${escapeHtml(ROOM_NUMBERS[currentGroup])}</span>` : ''}
      </div>
      ${rows}
      <div class="add-lesson-row">
        <input id="newLessonInput" placeholder="New lesson or topic..." onkeydown="if(event.key==='Enter') app.addLesson()">
        <button style="background:${grade.color}" onclick="app.addLesson()">Add</button>
      </div>
    `;
  }

  function renderClassroomSend(lessonId){
    return `<div class="classroom-send">
      <input type="file" class="cr-file-input">
      <label class="cr-copy-label"><input type="checkbox" class="cr-copy-check" checked> Give each student their own copy</label>
      <button class="cr-send-btn" onclick="app.sendToClassroom('${lessonId}', this)">Create draft in Classroom</button>
      <div class="cr-status"></div>
    </div>`;
  }

  function renderLinkRow(opts){
    const {key, icon, placeholder, value, hasContent, saveFn, lessonId} = opts;
    const editing = isLinkEditing(key, hasContent);
    if(!editing){
      return `<div class="link-row">
        <span class="link-label">${icon}</span>
        <span class="link-chip">🔗 Link saved</span>
        <button class="icon-btn" title="Edit link" aria-label="Edit link" onclick="app.toggleLinkEdit('${key}')">✏️</button>
        <a class="open-link" href="${escapeAttr(value)}" target="_blank" rel="noopener">Open ↗</a>
      </div>`;
    }
    return `<div class="link-row">
      <span class="link-label">${icon}</span>
      <input class="link-input" placeholder="${escapeAttr(placeholder)}" value="${escapeAttr(value)}"
        onfocus="app.setEditing(true)"
        onblur="app.setEditing(false); app.${saveFn}('${lessonId}', this.value); app.finishLinkEdit('${key}')">
      ${hasContent ? `<a class="open-link" href="${escapeAttr(value)}" target="_blank" rel="noopener">Open ↗</a>` : ''}
    </div>`;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }
  function escapeAttr(str){
    return String(str).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function render(){
    if(currentGroup){ renderDetail(); } else { renderHome(); }
  }

  // ---------- notes debounce ----------
  const notesTimers = {};
  function debouncedSaveNotes(lessonId, value){
    // update in-memory immediately, persist after a pause, no re-render (keeps focus)
    const gid = currentGroup;
    const groupData = state.groups[gid] || {progress:{}};
    if(!groupData.progress) groupData.progress = {};
    if(!groupData.progress[lessonId]) groupData.progress[lessonId] = {done:false, notes:''};
    groupData.progress[lessonId].notes = value;
    state.groups[gid] = groupData;
    clearTimeout(notesTimers[lessonId]);
    notesTimers[lessonId] = setTimeout(()=>{ saveGroup(gid, state.groups[gid]); }, 700);
  }

  // ---------- actions (exposed) ----------
  const app = {
    openGroup(groupId){ currentGroup = groupId; document.getElementById('homeView').classList.add('hidden'); document.getElementById('detailView').classList.remove('hidden'); render(); },
    goHome(){ currentGroup = null; document.getElementById('detailView').classList.add('hidden'); document.getElementById('homeView').classList.remove('hidden'); render(); },
    setEditing(v){ editingActive = v; },
    async toggleTomorrow(){
      const popup = document.getElementById('tomorrowPopup');
      const opening = popup.classList.contains('hidden');
      if(!opening){ popup.classList.add('hidden'); return; }
      popup.classList.remove('hidden');
      renderTomorrowList();
      if(tomorrowDayNumber === undefined){
        tomorrowDayNumber = await fetchDayNumberForDate(bogotaDateString(1));
        renderTomorrowList();
      }
    },
    togglePanel(key, hasContent){
      panelState[key] = !isPanelOpen(key, hasContent);
      renderDetail();
    },
    toggleLinkEdit(key){
      linkEditState[key] = !isLinkEditing(key, true);
      renderDetail();
    },
    finishLinkEdit(key){
      // defer to isLinkEditing's default: chip view once content exists, input view if still empty
      delete linkEditState[key];
      renderDetail();
    },
    saveSlidesLink(lessonId, value){
      value = value.trim();
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      const lesson = gradeData.lessons.find(l=>l.id===lessonId);
      if(lesson && lesson.slidesLink !== value){
        lesson.slidesLink = value;
        saveGrade(g, gradeData);
      }
      renderDetail();
    },
    saveWorksheetLink(lessonId, value){
      value = value.trim();
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      const lesson = gradeData.lessons.find(l=>l.id===lessonId);
      if(lesson && lesson.worksheetLink !== value){
        lesson.worksheetLink = value;
        saveGrade(g, gradeData);
      }
      renderDetail();
    },
    toggleLesson(lessonId, done){
      const gid = currentGroup;
      const groupData = state.groups[gid] || {progress:{}};
      if(!groupData.progress) groupData.progress = {};
      if(!groupData.progress[lessonId]) groupData.progress[lessonId] = {done:false, notes:''};
      groupData.progress[lessonId].done = done;
      state.groups[gid] = groupData;
      saveGroup(gid, groupData);
      renderDetail();
    },
    renameLesson(lessonId, newTitle){
      newTitle = newTitle.trim();
      if(!newTitle) newTitle = 'Untitled';
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      const lesson = gradeData.lessons.find(l=>l.id===lessonId);
      if(lesson && lesson.title !== newTitle){
        lesson.title = newTitle;
        saveGrade(g, gradeData);
      }
      renderDetail();
    },
    moveLesson(lessonId, delta){
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      const idx = gradeData.lessons.findIndex(l=>l.id===lessonId);
      const newIdx = idx + delta;
      if(idx === -1 || newIdx < 0 || newIdx >= gradeData.lessons.length) return;
      const [lesson] = gradeData.lessons.splice(idx, 1);
      gradeData.lessons.splice(newIdx, 0, lesson);
      saveGrade(g, gradeData);
      renderDetail();
    },
    addLesson(){
      const input = document.getElementById('newLessonInput');
      const title = input.value.trim();
      if(!title) return;
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      if(!gradeData.lessons) gradeData.lessons = [];
      gradeData.lessons.push({id: uid(), title});
      saveGrade(g, gradeData);
      renderDetail();
      setTimeout(()=>{ const el = document.getElementById('newLessonInput'); if(el) el.focus(); }, 0);
    },
    deleteLesson(evt, lessonId){
      const btn = evt.currentTarget;
      if(btn.dataset.confirm !== '1'){
        btn.dataset.confirm = '1';
        btn.textContent = 'Remove';
        btn.classList.add('confirm');
        setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='×'; btn.classList.remove('confirm'); }, 3000);
        return;
      }
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      gradeData.lessons = gradeData.lessons.filter(l=>l.id!==lessonId);
      saveGrade(g, gradeData);
      renderDetail();
    },
    openClassroom(){
      const courseId = classroomCourseIdFor(currentGroup);
      const url = courseId ? `https://classroom.google.com/c/${courseId}` : 'https://classroom.google.com/u/0/h';
      window.open(url, '_blank', 'noopener');
    },
    async sendToClassroom(lessonId, btn){
      const panel = btn.closest('.classroom-send');
      const statusEl = panel.querySelector('.cr-status');
      const fileInput = panel.querySelector('.cr-file-input');
      const copyCheck = panel.querySelector('.cr-copy-check');
      const file = fileInput.files[0];
      if(!file){ statusEl.textContent = 'Choose a file first.'; return; }
      const courseId = classroomCourseIdFor(currentGroup);
      if(!courseId){ statusEl.textContent = 'No Classroom link set for this group yet — add one to CLASSROOM_LINKS.'; return; }
      if(!oauthConfigured()){ statusEl.textContent = 'Google sign-in isn\'t set up yet — see README.md.'; return; }
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      const lesson = gradeData.lessons.find(l=>l.id===lessonId);
      if(!lesson) return;
      btn.disabled = true;
      try{
        statusEl.textContent = 'Signing in to Google…';
        const token = await getAccessToken();
        statusEl.textContent = 'Uploading file to Drive…';
        const driveFileId = await uploadFileToDrive(file, token);
        statusEl.textContent = 'Creating draft in Classroom…';
        const work = await createClassroomDraft(courseId, lesson.title, driveFileId, copyCheck.checked, token);
        statusEl.textContent = 'Draft created ✓ opening it now…';
        if(work.alternateLink) window.open(work.alternateLink, '_blank', 'noopener');
      }catch(e){
        console.error('classroom send error', e);
        statusEl.textContent = 'Error: ' + (e.message || 'something went wrong.');
      }finally{
        btn.disabled = false;
      }
    },
    debouncedSaveNotes
  };
  window.app = app;

  // ---------- academic calendar: today's rotation day ----------
  function bogotaDateString(offsetDays){
    const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Bogota', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
    const y = +parts.find(p=>p.type==='year').value;
    const mo = +parts.find(p=>p.type==='month').value;
    const d = +parts.find(p=>p.type==='day').value;
    const dt = new Date(Date.UTC(y, mo-1, d));
    dt.setUTCDate(dt.getUTCDate() + offsetDays);
    return dt.toISOString().slice(0, 10);
  }
  async function fetchDayNumberForDate(dateStr){
    if(!CALENDAR_CONFIG.apiKey || CALENDAR_CONFIG.apiKey === 'YOUR_GOOGLE_API_KEY') return null;
    try{
      const timeMin = `${dateStr}T00:00:00-05:00`;
      const timeMax = `${dateStr}T23:59:59-05:00`;
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_CONFIG.calendarId)}/events`
        + `?key=${encodeURIComponent(CALENDAR_CONFIG.apiKey)}&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true`;
      const res = await fetch(url);
      if(!res.ok) return null;
      const data = await res.json();
      for(const ev of (data.items || [])){
        const m = /(?:d[ií]a|day)\s*#?\s*([1-6])\b/i.exec(ev.summary || '');
        if(m) return m[1];
      }
    }catch(e){ console.error('calendar fetch error', e); }
    return null;
  }
  async function fetchTodayDayNumber(){
    todayDayNumber = await fetchDayNumberForDate(bogotaDateString(0));
  }
  function bogotaMinutesNow(){
    const parts = new Intl.DateTimeFormat('en-GB', {timeZone:'America/Bogota', hour:'2-digit', minute:'2-digit', hour12:false}).formatToParts(new Date());
    const h = parseInt(parts.find(p=>p.type==='hour').value, 10);
    const m = parseInt(parts.find(p=>p.type==='minute').value, 10);
    return h*60 + m;
  }
  function toMinutes(hhmm){
    const [h, m] = hhmm.split(':').map(Number);
    return h*60 + m;
  }
  function currentPeriodLabel(schedule, nowMin){
    const slot = schedule.find(s => nowMin >= toMinutes(s.start) && nowMin < toMinutes(s.end));
    return slot ? slot.label : null;
  }
  function currentPeriodText(){
    const nowMin = bogotaMinutesNow();
    const msLabel = currentPeriodLabel(MS_SCHEDULE, nowMin);
    const hsLabel = currentPeriodLabel(HS_SCHEDULE, nowMin);
    if(msLabel && hsLabel && msLabel === hsLabel) return `🕐 ${msLabel}`;
    if(msLabel && hsLabel) return `🕐 MS: ${msLabel} · HS: ${hsLabel}`;
    if(msLabel) return `🕐 MS: ${msLabel}`;
    if(hsLabel) return `🕐 HS: ${hsLabel}`;
    return '';
  }
  function updateTodayBanner(){
    const el = document.getElementById('todayBanner');
    if(!el) return;
    if(todayDayNumber){
      const periodText = currentPeriodText();
      el.textContent = `Today: Day ${todayDayNumber}` + (periodText ? ` · ${periodText}` : '');
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  function renderTomorrowList(){
    const el = document.getElementById('tomorrowPopup');
    if(!el) return;
    if(!CALENDAR_CONFIG.apiKey || CALENDAR_CONFIG.apiKey === 'YOUR_GOOGLE_API_KEY'){
      el.innerHTML = `<p class="empty-state">Calendar isn't connected yet — see README.md.</p>`;
      return;
    }
    if(tomorrowDayNumber === undefined){
      el.innerHTML = `<p class="empty-state">Loading…</p>`;
      return;
    }
    if(tomorrowDayNumber === null){
      el.innerHTML = `<div class="tomorrow-title">Tomorrow</div><p class="empty-state">No school tomorrow.</p>`;
      return;
    }
    const day = SCHEDULE_BY_DAY[tomorrowDayNumber] || {};
    const rows = Object.keys(day).map(groupId=>{
      const grade = gradeInfo(gradeOf(groupId));
      const label = grade.groups.length > 1 ? groupId : grade.name;
      return `<div class="tomorrow-row"><span>${escapeHtml(label)}</span><span class="tomorrow-period">${escapeHtml(day[groupId].join(' · '))}</span></div>`;
    }).join('');
    el.innerHTML = `<div class="tomorrow-title">Tomorrow: Day ${tomorrowDayNumber}</div>`
      + (rows || `<p class="empty-state">Nothing scheduled.</p>`);
  }

  // ---------- init ----------
  async function init(){
    const noteEl = document.getElementById('storageNote');
    try{
      if(firebaseConfig.apiKey && firebaseConfig.apiKey !== 'TU_API_KEY'){
        firebase.initializeApp(firebaseConfig);
        const firestoreDb = firebase.firestore();
        db = { doc(path){
          const [collection, id] = path.split('/');
          return firestoreDb.collection(collection).doc(id);
        }};
      }
    }catch(e){ console.error('firebase init error', e); db = null; }

    if(db){
      storageMode = 'db';
      noteEl.textContent = 'Auto-saved · synced across devices';
      GRADES.forEach(grade=>{
        db.doc('grades/'+grade.id).onSnapshot(snap=>{
          state.grades[grade.id] = snap.exists ? snap.data() : {lessons:[]};
          if(!editingActive) render();
        }, err=>{ console.error('grade snapshot error', err); });
        grade.groups.forEach(suffix=>{
          const groupId = grade.id+suffix;
          db.doc('groups/'+groupId).onSnapshot(snap=>{
            state.groups[groupId] = snap.exists ? snap.data() : {progress:{}};
            if(!editingActive) render();
          }, err=>{ console.error('group snapshot error', err); });
        });
      });
    } else {
      storageMode = 'local';
      noteEl.textContent = 'Local mode (this browser only)';
      noteEl.classList.add('local');
      GRADES.forEach(grade=>{
        loadGradeLocal(grade.id);
        grade.groups.forEach(suffix=> loadGroupLocal(grade.id+suffix));
      });
      render();
    }
    render();

    fetchTodayDayNumber().then(()=>{
      updateTodayBanner();
      if(!editingActive) render();
    });
    setInterval(updateTodayBanner, 60000); // keep the current-period text fresh
    // Background/inactive tabs get their timers throttled by the browser,
    // so also refresh immediately whenever the tab becomes visible again.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible') updateTodayBanner();
    });
    document.addEventListener('click', (e)=>{
      const popup = document.getElementById('tomorrowPopup');
      if(popup && !popup.classList.contains('hidden') && !e.target.closest('.tomorrow-wrap')){
        popup.classList.add('hidden');
      }
    });
  }

  init();
})();
</script>
</body>
</html>
