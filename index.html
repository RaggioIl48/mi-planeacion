<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi planeación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#eef2f1;
    --bg-elevated:#ffffff;
    --ink:#1f2a3c;
    --ink-soft:#5b6675;
    --line:#d7dedb;
    --line-soft:#e6ebe9;
    --accent-6:#3e7cb1;
    --accent-7:#4c9a6a;
    --accent-8:#b1793e;
    --accent-9:#8b5fbf;
    --danger:#b1493e;
    --danger-bg:#f6e9e7;
    --done-bg:#eaf3ea;
    --shadow: 0 1px 2px rgba(31,42,60,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161b22;
      --bg-elevated:#1f2530;
      --ink:#e7ebee;
      --ink-soft:#9aa4b2;
      --line:#333c48;
      --line-soft:#2a3037;
      --done-bg:#1c2b20;
      --danger-bg:#2e1f1e;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161b22;
    --bg-elevated:#1f2530;
    --ink:#e7ebee;
    --ink-soft:#9aa4b2;
    --line:#333c48;
    --line-soft:#2a3037;
    --done-bg:#1c2b20;
    --danger-bg:#2e1f1e;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  .storage-note{
    font-size:0.78rem;
    color:var(--ink-soft);
    background:var(--bg-elevated);
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:20px;
  }
  .storage-note.local{color:var(--accent-8);border-color:var(--accent-8);}

  /* ---------- HOME ---------- */
  .grade-block{margin-bottom:30px;}
  .grade-block h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0 0 12px 2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .grade-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--dot,#999);
    display:inline-block;
  }
  .group-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  @media (max-width:520px){
    .group-row{grid-template-columns:1fr 1fr;}
  }
  .group-card{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-left:3px solid var(--dot,#999);
    border-radius:8px;
    padding:12px 14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    text-align:left;
    transition:transform .12s ease, border-color .12s ease;
  }
  .group-card:hover{transform:translateY(-1px);}
  .group-card:focus-visible{outline:2px solid var(--dot,#999);outline-offset:2px;}
  .group-card .g-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.1rem;
  }
  .group-card .g-frac{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .group-card .g-bar{
    height:5px;border-radius:3px;background:var(--line-soft);
    margin:8px 0 6px;overflow:hidden;
  }
  .group-card .g-bar-fill{
    height:100%;background:var(--dot,#999);border-radius:3px;
  }
  .group-card .g-next{
    font-size:0.78rem;
    color:var(--ink-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .group-card .g-empty{
    font-size:0.78rem;color:var(--ink-soft);font-style:italic;
  }

  /* ---------- DETAIL ---------- */
  .detail-header{
    display:flex;align-items:center;gap:14px;margin-bottom:20px;
  }
  .back-btn{
    background:none;border:1px solid var(--line);color:var(--ink);
    padding:6px 12px;border-radius:20px;font-size:0.85rem;cursor:pointer;
    font-family:inherit;
  }
  .back-btn:hover{background:var(--line-soft);}
  .detail-header h2{
    font-family:'Fraunces', serif;font-weight:700;font-size:1.6rem;margin:0;
  }
  .lesson-list{list-style:none;margin:0 0 16px;padding:0;counter-reset:lesson;}
  .lesson-row{
    counter-increment:lesson;
    display:flex;gap:12px;align-items:flex-start;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .lesson-row.done{background:var(--done-bg);}
  .lesson-row::before{
    content:counter(lesson);
    font-family:'Fraunces', serif;font-weight:600;
    color:var(--ink-soft);
    min-width:20px;padding-top:3px;font-size:0.95rem;
  }
  .check{display:flex;align-items:flex-start;padding-top:3px;cursor:pointer;}
  .check input{width:17px;height:17px;cursor:pointer;accent-color:var(--dot,#3e7cb1);}
  .lesson-main{flex:1;min-width:0;}
  .lesson-line1{display:flex;align-items:center;gap:6px;}
  .lesson-title-input{
    flex:1;min-width:0;border:none;background:transparent;color:var(--ink);
    font-size:0.98rem;font-weight:500;padding:2px 0;font-family:inherit;
  }
  .lesson-row.done .lesson-title-input{color:var(--ink-soft);text-decoration:line-through;}
  .lesson-title-input:focus{outline:none;border-bottom:1px solid var(--line);}
  .icon-btn{
    border:1px solid var(--line);background:var(--bg-elevated);color:var(--ink-soft);
    border-radius:6px;padding:3px 7px;font-size:0.85rem;line-height:1.3;cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--line-soft);}
  .icon-btn.active{background:var(--dot,#3e7cb1);border-color:var(--dot,#3e7cb1);color:#fff;}
  .lesson-extra{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .link-row{display:flex;gap:8px;align-items:center;}
  .link-label{flex-shrink:0;font-size:0.9rem;opacity:0.8;}
  .link-row input{
    flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);font-size:0.82rem;font-family:inherit;
  }
  .link-row input:focus{outline:none;border-color:var(--dot,#3e7cb1);}
  .open-link{
    font-size:0.78rem;color:var(--ink);text-decoration:none;white-space:nowrap;
    border:1px solid var(--line);padding:5px 10px;border-radius:6px;flex-shrink:0;
  }
  .open-link:hover{background:var(--line-soft);}
  .link-chip{
    flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line-soft);border-radius:6px;
    background:var(--line-soft);color:var(--ink-soft);font-size:0.82rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .lesson-notes{
    width:100%;min-height:34px;resize:vertical;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);
    font-family:inherit;font-size:0.85rem;padding:6px 8px;border-radius:6px;
  }
  .lesson-notes:focus{outline:none;border-color:var(--dot,#3e7cb1);}
  .lesson-notes::placeholder{color:var(--ink-soft);opacity:0.7;}
  .del-btn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-size:1.1rem;line-height:1;padding:2px 4px;border-radius:4px;
  }
  .del-btn:hover{color:var(--danger);background:var(--danger-bg);}
  .del-btn.confirm{color:#fff;background:var(--danger);font-size:0.72rem;padding:3px 8px;}

  .add-lesson-row{
    display:flex;gap:8px;margin-top:4px;
  }
  .add-lesson-row input{
    flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-elevated);color:var(--ink);font-family:inherit;font-size:0.9rem;
  }
  .add-lesson-row input:focus{outline:none;border-color:var(--dot,#3e7cb1);}
  .add-lesson-row button{
    padding:9px 16px;border-radius:8px;border:none;
    background:var(--dot,#3e7cb1);color:#fff;font-family:inherit;font-weight:500;
    cursor:pointer;font-size:0.9rem;
  }
  .add-lesson-row button:hover{opacity:0.9;}

  .empty-state{
    color:var(--ink-soft);font-size:0.88rem;font-style:italic;padding:6px 2px 16px;
  }
  .loading{color:var(--ink-soft);font-size:0.88rem;padding:20px 2px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mi planeación</h1>
    <span class="storage-note" id="storageNote">Sincronizando…</span>
  </header>

  <div id="homeView"></div>
  <div id="detailView" class="hidden"></div>
</div>

<script>
(function(){
  "use strict";

  // Config de tu proyecto Firebase (Configuración del proyecto → General → Tus apps → SDK setup).
  // Ver README.md para los pasos para crear el proyecto y pegar estos valores.
  const firebaseConfig = {
    apiKey: "AIzaSyCUg67VGoEJ8NcyJpdVVkH44__SzUkmsr0",
    authDomain: "my-planning-cbe30.firebaseapp.com",
    projectId: "my-planning-cbe30",
    storageBucket: "my-planning-cbe30.firebasestorage.app",
    messagingSenderId: "641857686466",
    appId: "1:641857686466:web:f05883c0c6df5d4569245b"
  };

  const GRADES = [
    {id:'6', name:'Sexto',   color:'var(--accent-6)'},
    {id:'7', name:'Séptimo', color:'var(--accent-7)'},
    {id:'8', name:'Octavo',  color:'var(--accent-8)'},
    {id:'9', name:'Noveno',  color:'var(--accent-9)'},
  ];
  const LETTERS = ['A','B','C'];

  const state = { grades:{}, groups:{} };
  let currentGroup = null; // e.g. "6A"
  let db = null;
  let storageMode = 'pending'; // 'db' | 'local'
  let editingActive = false; // true while a title/notes field has focus

  // ephemeral UI-only state: which link/comment panels are expanded.
  // Not persisted — resets on reload. Defaults to "open" when the
  // lesson already has content, "closed" otherwise, until toggled.
  const panelState = {};
  function isPanelOpen(key, hasContent){
    return (key in panelState) ? panelState[key] : !!hasContent;
  }

  // ephemeral: which link fields are showing the raw-URL input vs the
  // compact "enlace guardado" chip. Links with content default to chip
  // view (hides the long URL) until the user taps the edit icon.
  const linkEditState = {};
  function isLinkEditing(key, hasContent){
    return (key in linkEditState) ? linkEditState[key] : !hasContent;
  }

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  }

  // ---------- storage abstraction ----------
  const LS_PREFIX = 'planeacion_v1_';
  function lsGet(key){
    try{ const v = localStorage.getItem(LS_PREFIX+key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  function lsSet(key, val){
    try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }catch(e){}
  }

  function gradeKey(g){ return 'grade_'+g; }
  function groupKey(g){ return 'group_'+g; }

  function loadGradeLocal(g){
    state.grades[g] = lsGet(gradeKey(g)) || {lessons:[]};
  }
  function loadGroupLocal(g){
    state.groups[g] = lsGet(groupKey(g)) || {progress:{}};
  }

  async function saveGrade(gradeId, data){
    state.grades[gradeId] = data;
    if(storageMode === 'db'){
      try{ await db.doc('grades/'+gradeId).set(data); }catch(e){ console.error(e); }
    } else {
      lsSet(gradeKey(gradeId), data);
    }
  }
  async function saveGroup(groupId, data){
    state.groups[groupId] = data;
    if(storageMode === 'db'){
      try{ await db.doc('groups/'+groupId).set(data); }catch(e){ console.error(e); }
    } else {
      lsSet(groupKey(groupId), data);
    }
  }

  // ---------- data helpers ----------
  function gradeOf(groupId){ return groupId[0]; }
  function letterOf(groupId){ return groupId[1]; }
  function gradeInfo(gradeId){ return GRADES.find(g=>g.id===gradeId); }

  function summarize(groupId){
    const g = gradeOf(groupId);
    const lessons = (state.grades[g] && state.grades[g].lessons) || [];
    const progress = (state.groups[groupId] && state.groups[groupId].progress) || {};
    const total = lessons.length;
    const done = lessons.filter(l => progress[l.id] && progress[l.id].done).length;
    const next = lessons.find(l => !(progress[l.id] && progress[l.id].done));
    return {total, done, nextTitle: next ? next.title : null};
  }

  // ---------- rendering: home ----------
  function renderHome(){
    const homeView = document.getElementById('homeView');
    let html = '';
    GRADES.forEach(grade=>{
      const loaded = !!state.grades[grade.id];
      html += `<section class="grade-block">
        <h2><span class="grade-dot" style="--dot:${grade.color}"></span>${grade.name} · ${grade.id}°</h2>
        <div class="group-row">`;
      LETTERS.forEach(letter=>{
        const groupId = grade.id + letter;
        if(!loaded || !state.groups[groupId]){
          html += `<div class="group-card" style="--dot:${grade.color}"><div class="g-name">${groupId}</div><div class="g-empty">Cargando…</div></div>`;
          return;
        }
        const s = summarize(groupId);
        let bodyHtml;
        if(s.total === 0){
          bodyHtml = `<div class="g-empty">Sin temario aún</div>`;
        } else {
          const pct = Math.round((s.done/s.total)*100);
          const nextLine = s.nextTitle ? escapeHtml(s.nextTitle) : '¡Completado!';
          bodyHtml = `
            <div class="g-frac">${s.done}/${s.total} lecciones</div>
            <div class="g-bar"><div class="g-bar-fill" style="width:${pct}%; --dot:${grade.color}"></div></div>
            <div class="g-next">${nextLine}</div>`;
        }
        html += `<button class="group-card" style="--dot:${grade.color}" onclick="app.openGroup('${groupId}')">
          <div class="g-name">${groupId}</div>
          ${bodyHtml}
        </button>`;
      });
      html += `</div></section>`;
    });
    homeView.innerHTML = html;
  }

  // ---------- rendering: detail ----------
  function renderDetail(){
    if(!currentGroup) return;
    const detailView = document.getElementById('detailView');
    const g = gradeOf(currentGroup);
    const grade = gradeInfo(g);
    const lessons = (state.grades[g] && state.grades[g].lessons) || [];
    const progress = (state.groups[currentGroup] && state.groups[currentGroup].progress) || {};

    let rows = '';
    if(lessons.length === 0){
      rows = `<p class="empty-state">Todavía no hay lecciones para ${grade.name.toLowerCase()} grado. Agrega la primera abajo — se compartirá con 6A/B/C del mismo grado, cada grupo lleva su propio avance.</p>`;
    } else {
      rows = '<ol class="lesson-list">' + lessons.map(lesson=>{
        const p = progress[lesson.id] || {done:false, notes:''};
        const slidesKey = lesson.id+':slides';
        const worksheetKey = lesson.id+':worksheet';
        const notesKey = lesson.id+':notes';
        const slidesLink = lesson.slidesLink || lesson.link || ''; // lesson.link = valor de versiones anteriores
        const worksheetLink = lesson.worksheetLink || '';
        const hasSlides = !!slidesLink.trim();
        const hasWorksheet = !!worksheetLink.trim();
        const hasNotes = !!(p.notes && p.notes.trim());
        const slidesOpen = isPanelOpen(slidesKey, hasSlides);
        const worksheetOpen = isPanelOpen(worksheetKey, hasWorksheet);
        const notesOpen = isPanelOpen(notesKey, hasNotes);
        return `<li class="lesson-row ${p.done?'done':''}" data-lid="${lesson.id}">
          <label class="check">
            <input type="checkbox" ${p.done?'checked':''} onchange="app.toggleLesson('${lesson.id}', this.checked)">
          </label>
          <div class="lesson-main">
            <div class="lesson-line1">
              <input class="lesson-title-input" value="${escapeAttr(lesson.title)}"
                onfocus="app.setEditing(true)"
                onblur="app.setEditing(false); app.renameLesson('${lesson.id}', this.value)">
              <button class="icon-btn ${hasSlides?'active':''}" title="Diapositivas" aria-label="Diapositivas" onclick="app.togglePanel('${slidesKey}', ${hasSlides})">📊</button>
              <button class="icon-btn ${hasWorksheet?'active':''}" title="Worksheet" aria-label="Worksheet" onclick="app.togglePanel('${worksheetKey}', ${hasWorksheet})">📝</button>
              <button class="icon-btn ${hasNotes?'active':''}" title="Comentario" aria-label="Comentario" onclick="app.togglePanel('${notesKey}', ${hasNotes})">💬</button>
            </div>
            <div class="lesson-extra">
              ${slidesOpen ? renderLinkRow({
                key: slidesKey, icon:'📊', placeholder:'Enlace a las diapositivas (Drive)...',
                value: slidesLink, hasContent: hasSlides,
                saveFn: 'saveSlidesLink', lessonId: lesson.id
              }) : ''}
              ${worksheetOpen ? renderLinkRow({
                key: worksheetKey, icon:'📝', placeholder:'Enlace al worksheet (Drive)...',
                value: worksheetLink, hasContent: hasWorksheet,
                saveFn: 'saveWorksheetLink', lessonId: lesson.id
              }) : ''}
              ${notesOpen ? `<textarea class="lesson-notes" placeholder="Comentario para este grupo (qué faltó, tarea dejada...)"
                onfocus="app.setEditing(true)"
                onblur="app.setEditing(false)"
                oninput="app.debouncedSaveNotes('${lesson.id}', this.value)">${escapeHtml(p.notes||'')}</textarea>` : ''}
            </div>
          </div>
          <button class="del-btn" onclick="app.deleteLesson(event, '${lesson.id}')">×</button>
        </li>`;
      }).join('') + '</ol>';
    }

    detailView.innerHTML = `
      <div class="detail-header">
        <button class="back-btn" onclick="app.goHome()">← ${grade.name}</button>
        <h2>${currentGroup}</h2>
      </div>
      ${rows}
      <div class="add-lesson-row">
        <input id="newLessonInput" placeholder="Nueva lección o tema..." onkeydown="if(event.key==='Enter') app.addLesson()">
        <button style="background:${grade.color}" onclick="app.addLesson()">Agregar</button>
      </div>
    `;
  }

  function renderLinkRow(opts){
    const {key, icon, placeholder, value, hasContent, saveFn, lessonId} = opts;
    const editing = isLinkEditing(key, hasContent);
    if(!editing){
      return `<div class="link-row">
        <span class="link-label">${icon}</span>
        <span class="link-chip">🔗 Enlace guardado</span>
        <button class="icon-btn" title="Editar enlace" aria-label="Editar enlace" onclick="app.toggleLinkEdit('${key}')">✏️</button>
        <a class="open-link" href="${escapeAttr(value)}" target="_blank" rel="noopener">Abrir ↗</a>
      </div>`;
    }
    return `<div class="link-row">
      <span class="link-label">${icon}</span>
      <input class="link-input" placeholder="${escapeAttr(placeholder)}" value="${escapeAttr(value)}"
        onfocus="app.setEditing(true)"
        onblur="app.setEditing(false); app.${saveFn}('${lessonId}', this.value); app.finishLinkEdit('${key}')">
      ${hasContent ? `<a class="open-link" href="${escapeAttr(value)}" target="_blank" rel="noopener">Abrir ↗</a>` : ''}
    </div>`;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }
  function escapeAttr(str){
    return String(str).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function render(){
    if(currentGroup){ renderDetail(); } else { renderHome(); }
  }

  // ---------- notes debounce ----------
  const notesTimers = {};
  function debouncedSaveNotes(lessonId, value){
    // update in-memory immediately, persist after a pause, no re-render (keeps focus)
    const gid = currentGroup;
    const groupData = state.groups[gid] || {progress:{}};
    if(!groupData.progress) groupData.progress = {};
    if(!groupData.progress[lessonId]) groupData.progress[lessonId] = {done:false, notes:''};
    groupData.progress[lessonId].notes = value;
    state.groups[gid] = groupData;
    clearTimeout(notesTimers[lessonId]);
    notesTimers[lessonId] = setTimeout(()=>{ saveGroup(gid, state.groups[gid]); }, 700);
  }

  // ---------- actions (exposed) ----------
  const app = {
    openGroup(groupId){ currentGroup = groupId; document.getElementById('homeView').classList.add('hidden'); document.getElementById('detailView').classList.remove('hidden'); render(); },
    goHome(){ currentGroup = null; document.getElementById('detailView').classList.add('hidden'); document.getElementById('homeView').classList.remove('hidden'); render(); },
    setEditing(v){ editingActive = v; },
    togglePanel(key, hasContent){
      panelState[key] = !isPanelOpen(key, hasContent);
      renderDetail();
    },
    toggleLinkEdit(key){
      linkEditState[key] = !isLinkEditing(key, true);
      renderDetail();
    },
    finishLinkEdit(key){
      // defer to isLinkEditing's default: chip view once content exists, input view if still empty
      delete linkEditState[key];
      renderDetail();
    },
    saveSlidesLink(lessonId, value){
      value = value.trim();
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      const lesson = gradeData.lessons.find(l=>l.id===lessonId);
      if(lesson && lesson.slidesLink !== value){
        lesson.slidesLink = value;
        saveGrade(g, gradeData);
      }
      renderDetail();
    },
    saveWorksheetLink(lessonId, value){
      value = value.trim();
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      const lesson = gradeData.lessons.find(l=>l.id===lessonId);
      if(lesson && lesson.worksheetLink !== value){
        lesson.worksheetLink = value;
        saveGrade(g, gradeData);
      }
      renderDetail();
    },
    toggleLesson(lessonId, done){
      const gid = currentGroup;
      const groupData = state.groups[gid] || {progress:{}};
      if(!groupData.progress) groupData.progress = {};
      if(!groupData.progress[lessonId]) groupData.progress[lessonId] = {done:false, notes:''};
      groupData.progress[lessonId].done = done;
      state.groups[gid] = groupData;
      saveGroup(gid, groupData);
      renderDetail();
    },
    renameLesson(lessonId, newTitle){
      newTitle = newTitle.trim();
      if(!newTitle) newTitle = 'Sin título';
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      const lesson = gradeData.lessons.find(l=>l.id===lessonId);
      if(lesson && lesson.title !== newTitle){
        lesson.title = newTitle;
        saveGrade(g, gradeData);
      }
      renderDetail();
    },
    addLesson(){
      const input = document.getElementById('newLessonInput');
      const title = input.value.trim();
      if(!title) return;
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      if(!gradeData.lessons) gradeData.lessons = [];
      gradeData.lessons.push({id: uid(), title});
      saveGrade(g, gradeData);
      renderDetail();
      setTimeout(()=>{ const el = document.getElementById('newLessonInput'); if(el) el.focus(); }, 0);
    },
    deleteLesson(evt, lessonId){
      const btn = evt.currentTarget;
      if(btn.dataset.confirm !== '1'){
        btn.dataset.confirm = '1';
        btn.textContent = 'Quitar';
        btn.classList.add('confirm');
        setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='×'; btn.classList.remove('confirm'); }, 3000);
        return;
      }
      const g = gradeOf(currentGroup);
      const gradeData = state.grades[g] || {lessons:[]};
      gradeData.lessons = gradeData.lessons.filter(l=>l.id!==lessonId);
      saveGrade(g, gradeData);
      renderDetail();
    },
    debouncedSaveNotes
  };
  window.app = app;

  // ---------- init ----------
  async function init(){
    const noteEl = document.getElementById('storageNote');
    try{
      if(firebaseConfig.apiKey && firebaseConfig.apiKey !== 'TU_API_KEY'){
        firebase.initializeApp(firebaseConfig);
        const firestoreDb = firebase.firestore();
        db = { doc(path){
          const [collection, id] = path.split('/');
          return firestoreDb.collection(collection).doc(id);
        }};
      }
    }catch(e){ console.error('firebase init error', e); db = null; }

    if(db){
      storageMode = 'db';
      noteEl.textContent = 'Guardado automático · varios dispositivos';
      GRADES.forEach(grade=>{
        db.doc('grades/'+grade.id).onSnapshot(snap=>{
          state.grades[grade.id] = snap.exists ? snap.data() : {lessons:[]};
          if(!editingActive) render();
        }, err=>{ console.error('grade snapshot error', err); });
        LETTERS.forEach(letter=>{
          const groupId = grade.id+letter;
          db.doc('groups/'+groupId).onSnapshot(snap=>{
            state.groups[groupId] = snap.exists ? snap.data() : {progress:{}};
            if(!editingActive) render();
          }, err=>{ console.error('group snapshot error', err); });
        });
      });
    } else {
      storageMode = 'local';
      noteEl.textContent = 'Modo local (solo este navegador)';
      noteEl.classList.add('local');
      GRADES.forEach(grade=>{
        loadGradeLocal(grade.id);
        LETTERS.forEach(letter=> loadGroupLocal(grade.id+letter));
      });
      render();
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
